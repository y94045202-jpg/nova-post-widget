<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Subscribe — Nova Post</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #F5F5F5; padding: 2rem; }

    .np-widget { font-family: 'Montserrat', sans-serif; background: #fff; border-radius: 16px; border: 1.5px solid #E8E8E8; padding: 2rem 2rem 1.75rem; width: 100%; max-width: 480px; }

    .np-logo-row { display: flex; align-items: center; gap: 10px; margin-bottom: 1.5rem; }
    .np-logo-icon { display: flex; align-items: center; justify-content: center; }
    .np-logo-icon svg { width: 52px; height: auto; }

    .np-divider { height: 1px; background: #F0F0F0; margin: 0 0 1.4rem; }

    .np-heading { font-size: 18px; font-weight: 700; color: #1A1A1A; margin: 0 0 6px; line-height: 1.3; }
    .np-desc { font-size: 13px; color: #888; margin: 0 0 1.4rem; line-height: 1.5; font-weight: 400; }

    .np-field-wrap { position: relative; margin-bottom: 1rem; }
    .np-field-icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: #BDBDBD; font-size: 18px; pointer-events: none; }

    .np-input { width: 100%; height: 48px; border: 1.5px solid #E0E0E0; border-radius: 10px; padding: 0 14px 0 42px; font-family: 'Montserrat', sans-serif; font-size: 14px; font-weight: 500; color: #1A1A1A; background: #FAFAFA; outline: none; transition: border-color 0.18s, box-shadow 0.18s, background 0.18s; }
    .np-input::placeholder { color: #C0C0C0; font-weight: 400; }
    .np-input:focus { border-color: #DA291C; background: #fff; box-shadow: 0 0 0 3px rgba(218,41,28,0.1); }
    .np-input.np-error { border-color: #DA291C; background: #FFF5F5; box-shadow: 0 0 0 3px rgba(218,41,28,0.08); }

    .np-error-msg { font-size: 12px; color: #DA291C; font-weight: 500; margin: 5px 0 0 4px; display: none; align-items: center; gap: 4px; }
    .np-error-msg.visible { display: flex; }

    .np-btn { width: 100%; height: 48px; background: #DA291C; color: #fff; border: none; border-radius: 10px; font-family: 'Montserrat', sans-serif; font-size: 15px; font-weight: 700; letter-spacing: 0.03em; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.16s, transform 0.1s, box-shadow 0.16s; }
    .np-btn:hover { background: #B82216; box-shadow: 0 4px 14px rgba(218,41,28,0.25); }
    .np-btn:active { transform: scale(0.98); }
    .np-btn:disabled { background: #BDBDBD; cursor: not-allowed; box-shadow: none; transform: none; }
    .np-btn .btn-icon { font-size: 18px; }

    .np-success { display: none; flex-direction: column; align-items: center; padding: 1.2rem 0 0.5rem; gap: 10px; text-align: center; }
    .np-success.visible { display: flex; }
    .np-success-icon { width: 52px; height: 52px; border-radius: 50%; background: #EDFAF4; display: flex; align-items: center; justify-content: center; font-size: 26px; color: #1DB163; }
    .np-success-title { font-size: 15px; font-weight: 700; color: #1A1A1A; }
    .np-success-sub { font-size: 12px; color: #888; }

    .np-footer { margin-top: 1.2rem; font-size: 11px; color: #C0C0C0; text-align: center; line-height: 1.5; }

    .np-loading-dots { display: inline-flex; gap: 4px; align-items: center; }
    .np-loading-dots span { width: 6px; height: 6px; background: #fff; border-radius: 50%; animation: np-dot-bounce 1s infinite; }
    .np-loading-dots span:nth-child(2) { animation-delay: 0.15s; }
    .np-loading-dots span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes np-dot-bounce { 0%, 80%, 100% { transform: translateY(0); opacity: 0.7; } 40% { transform: translateY(-5px); opacity: 1; } }
  </style>
</head>
<body>

  <div class="np-widget">
    <div class="np-logo-row">
      <div class="np-logo-icon" aria-label="Nova Post">
        <svg viewBox="0 0 220 90" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nova Post logo">
          <g>
            <polygon points="0,45 18,28 18,38 38,38 38,52 18,52 18,62" fill="#DA291C"/>
            <polygon points="76,45 58,28 58,38 38,38 38,52 58,52 58,62" fill="#DA291C"/>
            <polygon points="38,0 55,18 45,18 45,38 31,38 31,18 21,18" fill="#DA291C"/>
            <polygon points="38,90 55,72 45,72 45,52 31,52 31,72 21,72" fill="#DA291C"/>
            <rect x="31" y="38" width="14" height="14" fill="#DA291C"/>
          </g>
          <text x="88" y="42" font-family="Montserrat, Arial, sans-serif" font-weight="800" font-size="34" fill="#DA291C" letter-spacing="1">NOVA</text>
          <text x="88" y="82" font-family="Montserrat, Arial, sans-serif" font-weight="800" font-size="34" fill="#DA291C" letter-spacing="1">POST</text>
        </svg>
      </div>
    </div>

    <div class="np-divider"></div>

    <p class="np-heading">Subscribe to updates</p>
    <p class="np-desc">Get the latest news about Nova Post.</p>

    <div id="formArea">
      <div class="np-field-wrap">
        <i class="ti ti-mail np-field-icon" aria-hidden="true"></i>
        <input
          class="np-input"
          id="emailInput"
          type="email"
          placeholder="your@email.com"
          autocomplete="email"
          aria-label="Email"
        />
      </div>
      <div class="np-error-msg" id="errorMsg" role="alert">
        <i class="ti ti-alert-circle" style="font-size:14px;"></i>
        <span id="errorText">Please enter your email</span>
      </div>
      <div style="margin-top: 1rem;">
        <button class="np-btn" id="subscribeBtn" type="button" aria-label="Subscribe to the newsletter">
          <i class="ti ti-send btn-icon" aria-hidden="true"></i>
          <span id="btnText">Subscribe</span>
        </button>
      </div>
    </div>

    <div class="np-success" id="successBlock" aria-live="polite">
      <div class="np-success-icon" aria-hidden="true">
        <i class="ti ti-circle-check"></i>
      </div>
      <p class="np-success-title">Thank you for subscribing!</p>
      <p class="np-success-sub" id="successEmail"></p>
    </div>

    <p class="np-footer">By clicking “Subscribe,” you agree to Nova Post's terms and conditions<br>regarding the processing of personal data.</p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const WEBHOOK_URL =
      params.get('webhook') ||
      window.NOVA_WEBHOOK_URL ||
      'https://webhook.site/8b9b302e-cd24-45c0-9e0c-843486fe6c04';

    const emailInput   = document.getElementById('emailInput');
    const subscribeBtn = document.getElementById('subscribeBtn');
    const errorMsg     = document.getElementById('errorMsg');
    const errorText    = document.getElementById('errorText');
    const btnText      = document.getElementById('btnText');
    const successBlock = document.getElementById('successBlock');
    const formArea     = document.getElementById('formArea');
    const successEmail = document.getElementById('successEmail');

    function isValidEmail(v) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim());
    }
    function showError(msg) {
      emailInput.classList.add('np-error');
      errorText.textContent = msg;
      errorMsg.classList.add('visible');
    }
    function clearError() {
      emailInput.classList.remove('np-error');
      errorMsg.classList.remove('visible');
    }

    emailInput.addEventListener('input', clearError);
    emailInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') subscribeBtn.click();
    });

    subscribeBtn.addEventListener('click', async function () {
      const val = emailInput.value.trim();
      if (!val) { showError('Please enter your email address'); emailInput.focus(); return; }
      if (!isValidEmail(val)) { showError('Please enter a valid email address'); emailInput.focus(); return; }

      clearError();
      subscribeBtn.disabled = true;
      btnText.innerHTML = '<span class="np-loading-dots"><span></span><span></span><span></span></span>';

      try {
        await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: val, action: 'subscribe' }),
          mode: 'no-cors'
        });
        formArea.style.display = 'none';
        successEmail.textContent = val;
        successBlock.classList.add('visible');
      } catch (err) {
        subscribeBtn.disabled = false;
        btnText.innerHTML = '<i class="ti ti-send btn-icon" aria-hidden="true"></i> Subscribe';
        showError("Connection error. Please try again.");
      }
    });
  </script>

</body>
</html>
